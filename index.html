<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แสงแรกแห่งสายน้ำ – ตำนานลอยกระทง</title>
<link href="https://fonts.googleapis.com/css2?family=Charmonman:wght@700&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#efe6d2;--ink:#2b1d12;--gold:#c8962e;--red:#a8322a;--jade:#3f7a68;--panel:#e4d7ba;--page:#efe6d2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#17110b;--ink:#f0e4c8;--panel:#2a2016;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:'Sarabun',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px}
h1{font-family:'Charmonman',serif;font-size:clamp(1.5rem,4vw,2.4rem);margin:4px 0 12px;text-align:center}
#stage{position:relative;width:min(100%,960px);aspect-ratio:16/9;background:#efe6d2;border:6px double #6b4a22;overflow:hidden}
#stage svg{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity 1.2s}
#stage svg.on{opacity:1}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(60,35,10,.35));mix-blend-mode:multiply}
#sub{position:absolute;left:0;right:0;bottom:0;padding:12px 18px;background:linear-gradient(transparent,rgba(30,18,8,.88));color:#fbf1d6;font-size:clamp(.8rem,2.2vw,1.2rem);line-height:1.6;text-align:center;z-index:2}
#ttl{position:absolute;top:8px;left:12px;z-index:2;font-family:'Charmonman',serif;color:#fbf1d6;text-shadow:0 1px 3px #000;font-size:clamp(.8rem,2vw,1.2rem)}
#ctl{width:min(100%,960px);display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
button{font:inherit;background:var(--red);color:#fff;border:0;padding:8px 18px;cursor:pointer;border-radius:4px}
button.alt{background:var(--panel);color:var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input[type=range]{flex:1;min-width:140px;accent-color:var(--red)}
#tm{font-variant-numeric:tabular-nums;min-width:90px;text-align:right}
#note{width:min(100%,960px);font-size:.85rem;opacity:.75;margin-top:8px}
.fl{animation:fl 1.1s ease-in-out infinite alternate}
@keyframes fl{to{transform:scale(1.25,.85)}}
.bob{animation:bob 4s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(1.2px)}}
.drift{animation:dr 30s linear infinite}
@keyframes dr{from{transform:translateX(0)}to{transform:translateX(-30px)}}
.rise{animation:ri 14s linear infinite}
@keyframes ri{from{transform:translateY(0)}to{transform:translateY(-95px)}}
@media (prefers-reduced-motion:reduce){.fl,.bob,.drift,.rise{animation:none}}
</style>
</head>
<body>
<h1>แสงแรกแห่งสายน้ำ</h1>
<div id="stage"><div id="ttl"></div><div id="sub"></div></div>
<div id="ctl">
<button id="play">▶ เล่น</button>
<input type="range" id="bar" min="0" max="180" step="0.1" value="0" aria-label="ไทม์ไลน์">
<span id="tm">0:00 / 3:00</span>
<button class="alt" id="vo" aria-pressed="true">🔊 เสียงบรรยาย</button>
</div>
<p id="note">เสียงบรรยายใช้เสียงอ่านภาษาไทยของเบราว์เซอร์ ซึ่งอาจไม่มีในบางอุปกรณ์ หากไม่มีเสียง จะแสดงเป็นคำบรรยายตามเวลา</p>
<script>
const S=document.getElementById('stage');
const sky=(a,b)=>`<defs><linearGradient id="g${a.slice(1)}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="160" height="90" fill="url(#g${a.slice(1)})"/>`;
const moon=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r*1.6}" fill="#f6dc8a" opacity=".25"/><circle cx="${x}" cy="${y}" r="${r}" fill="#f8e7a8" stroke="#8a6a1e" stroke-width=".4"/>`;
const river=(y,c='#2f5a56')=>{let w='';for(let i=0;i<9;i++)w+=`<path d="M${-10+i*20} ${y+6+(i%3)*8} q5 -3 10 0 t10 0" fill="none" stroke="#bfe0c8" stroke-width=".4" opacity=".6"/>`;return `<rect y="${y}" width="160" height="${90-y}" fill="${c}"/><g class="drift">${w}</g>`};
const krat=(x,y,s=1)=>`<g class="bob" transform="translate(${x} ${y}) scale(${s})"><ellipse cx="0" cy="2" rx="7" ry="2" fill="#5b8a46"/><path d="M-6 1 Q-4 -5 -2 1 Q0 -7 2 1 Q4 -5 6 1Z" fill="#f3b3c2" stroke="#8a2f4a" stroke-width=".3"/><rect x="-.4" y="-6" width=".8" height="5" fill="#f6ecd2"/><ellipse class="fl" style="transform-origin:0 -7px" cx="0" cy="-7.5" rx=".9" ry="1.8" fill="#ffb02e"/><circle cx="0" cy="-7.5" r="3" fill="#ffb02e" opacity=".25"/></g>`;
const person=(x,y,c,s=1,pose='')=>`<g transform="translate(${x} ${y}) scale(${s})"><circle cy="-11" r="2.2" fill="#d9a066" stroke="#2b1d12" stroke-width=".3"/><path d="M-3 -8 h6 l1 10 h-8Z" fill="${c}" stroke="#2b1d12" stroke-width=".3"/>${pose||'<path d="M-2 -6 l2 3 l2 -3" fill="none" stroke="#d9a066" stroke-width="1"/>'}</g>`;
const chedi=(x,y,s)=>`<g transform="translate(${x} ${y}) scale(${s})" stroke="#2b1d12" stroke-width=".35"><rect x="-9" y="-4" width="18" height="4" fill="#c9a96e"/><rect x="-7" y="-9" width="14" height="5" fill="#d8bb7e"/><path d="M-4 -9 Q0 -34 4 -9Z" fill="#e3c98d"/><path d="M0 -30 L0 -38" stroke-width=".6"/><path d="M-4 -9 h8 M-3 -15 h6 M-2 -21 h4" fill="none"/></g>`;
const stars=n=>{let s='';for(let i=0;i<n;i++)s+=`<circle cx="${(i*37)%160}" cy="${(i*23)%40}" r=".4" fill="#fbe9b0" opacity=".8"/>`;return s};
const lantern=(x,y,d)=>`<g class="rise" style="animation-delay:-${d}s"><g transform="translate(${x} ${y})"><path d="M-2 0 l1 -4 h2 l1 4Z" fill="#ffb02e" stroke="#a8322a" stroke-width=".3"/><circle cy="-2" r="4" fill="#ffb02e" opacity=".22"/></g></g>`;
const frame='<rect x="1.5" y="1.5" width="157" height="87" fill="none" stroke="#6b4a22" stroke-width=".5"/>';
const scenes=[
{d:20,t:'ทุกปีเมื่อถึงคืนเดือนเพ็ญเดือนสิบสอง สายน้ำทั่วแผ่นดินไทยจะเปล่งประกายด้วยแสงเทียนนับหมื่นดวง นี่คือค่ำคืนแห่งการขอบคุณ การขออภัย และการเริ่มต้นใหม่ ค่ำคืนที่เรียกว่า วันลอยกระทง',
 svg:()=>sky('#e7a24a','#b5532c')+stars(0)+moon(105,28,10)+river(56)+`<path d="M20 52 q20 -4 40 0" stroke="#2b1d12" fill="none" stroke-width=".5"/><g class="bob"><path d="M30 60 h26 l-4 5 h-18Z" fill="#6b4a22" stroke="#2b1d12" stroke-width=".4"/><path d="M43 60 v-8" stroke="#2b1d12" stroke-width=".4"/></g>`+krat(100,66,1)+krat(125,72,1.2)+krat(80,78,.9)},
{d:25,t:'นานมาแล้ว ผู้คนในดินแดนแถบนี้ดำรงชีวิตด้วยสายน้ำ น้ำให้ข้าว ให้ปลา และให้ชีวิต เมื่อน้ำหลากสิ้นสุดลง พวกเขาจึงมาริมฝั่งเพื่อกล่าวคำขอบคุณพระแม่คงคา และขอขมาที่เคยใช้น้ำโดยไม่ระมัดระวัง',
 svg:()=>sky('#d9b068','#a8742f')+`<rect y="52" width="160" height="38" fill="#7a5a2c"/>`+river(66,'#3f6b5e')+`<circle cx="118" cy="30" r="18" fill="#8fc7b4" opacity=".35"/><path d="M110 46 q8 -26 16 0 q-8 6 -16 0Z" fill="#8fc7b4" opacity=".5" stroke="#3f7a68" stroke-width=".4"/>`+person(30,56,'#a8322a',1.4,'<path d="M-2 -6 l2 -3 l2 3" fill="none" stroke="#d9a066" stroke-width="1"/>')+person(50,57,'#3f7a68',1.3)+person(70,56,'#c8962e',1.4,'<path d="M-2 -6 l2 -3 l2 3" fill="none" stroke="#d9a066" stroke-width="1"/>')+`<g stroke="#2b1d12" stroke-width=".3"><path d="M90 58 q2 -12 -1 -16 M92 58 q4 -10 5 -14" fill="none" stroke="#c8962e" stroke-width=".8"/></g>`+krat(95,70,.9)},
{d:30,t:'เล่ากันว่าเมื่อเจ็ดร้อยปีก่อน ณ กรุงสุโขทัย มีสตรีผู้หนึ่งนามว่า นางนพมาศ เป็นสนมเอกในพระร่วงเจ้า นางมีสติปัญญาเฉียบแหลมและฝีมือประณีต ในค่ำคืนเดือนสิบสอง นางครุ่นคิดว่าจะถวายสิ่งใดให้งดงามต่างจากทุกปี',
 svg:()=>sky('#3c3a5c','#c27a4a')+stars(30)+moon(130,20,7)+`<rect y="66" width="160" height="24" fill="#2f5a56"/>`+chedi(80,66,1.5)+chedi(35,66,.8)+chedi(125,66,.8)+`<path d="M0 66 h160" stroke="#2b1d12" stroke-width=".6"/><g fill="#9a7a4a" stroke="#2b1d12" stroke-width=".3"><rect x="0" y="62" width="160" height="4"/></g><g class="drift" opacity=".5"><path d="M0 76 q5 -2 10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0" stroke="#bfe0c8" fill="none" stroke-width=".4"/></g>`+person(14,88,'#a8322a',1.1)},
{d:35,t:'นางจึงนำใบตองมาพับเป็นรูปดอกบัวบาน ประดับด้วยดอกไม้ ธูป และเทียน แล้วนำไปลอยในสระ เมื่อพระร่วงทอดพระเนตรเห็นแสงเทียนล่องลอยบนผิวน้ำอย่างสงบงาม ก็ทรงโปรดปรานยิ่งนัก และรับสั่งให้ถือเป็นประเพณีสืบต่อมา',
 svg:()=>sky('#5a3a2a','#2b1d12')+`<rect x="10" y="10" width="40" height="55" fill="#7a2f26" stroke="#c8962e" stroke-width=".6"/><path d="M10 10 q20 -8 40 0" fill="#a8322a"/><rect x="0" y="62" width="160" height="28" fill="#4a3220"/>`+person(70,66,'#a8322a',3.2,'<path d="M-3 -4 l3 4 l3 -4" fill="none" stroke="#d9a066" stroke-width="1"/>')+`<g transform="translate(100 62)"><ellipse cy="2" rx="13" ry="4" fill="#5b8a46" stroke="#2b1d12" stroke-width=".3"/><path d="M-11 1 Q-7 -12 -3 1 Q0 -16 3 1 Q7 -12 11 1Z" fill="#f3b3c2" stroke="#8a2f4a" stroke-width=".4"/><rect x="-.6" y="-12" width="1.2" height="10" fill="#f6ecd2"/><ellipse class="fl" style="transform-origin:0 -14px" cx="0" cy="-15" rx="1.4" ry="3" fill="#ffb02e"/><circle cy="-15" r="8" fill="#ffb02e" opacity=".25"/></g>`+krat(135,80,1)+krat(40,82,.8)},
{d:35,t:'ชาวบ้านพากันทำกระทงของตนเอง บางคนใส่เส้นผมและเล็บ เพื่อปล่อยความทุกข์ไปกับสายน้ำ บางคนอธิษฐานขอบคุณพระแม่คงคา และบางคนลอยกระทงเพื่อบูชารอยพระพุทธบาทริมฝั่งนัมมทานที โคมไฟสว่างไสว เสียงหัวเราะและบทเพลงดังก้องไปทั่ว',
 svg:()=>sky('#2a2e54','#8a4a3a')+stars(25)+moon(30,18,8)+`<rect y="50" width="160" height="40" fill="#7a5a2c"/>`+river(62,'#24494a')+person(25,56,'#a8322a',1.5)+person(45,55,'#3f7a68',1.4)+person(65,56,'#c8962e',1.5)+person(85,55,'#8a4a8a',1.3)+person(10,57,'#c8962e',1.2)+`<g opacity=".95">`+[0,1,2,3,4,5,6].map(i=>krat(30+i*18,68+(i%3)*7,1+(i%2)*.2)).join('')+`</g>`},
{d:25,t:'จากสุโขทัยสู่ปัจจุบัน ประเพณีนี้ยังคงงดงามไม่เปลี่ยน ที่เชียงใหม่ โคมลอยนับพันล่องฟ้าในประเพณียี่เป็ง ที่สุโขทัย แสงสีเสียงถ่ายทอดตำนานให้คนรุ่นใหม่ และวันนี้ เรายังเลือกกระทงที่ย่อยสลายได้ เพื่อรักษาสายน้ำให้อยู่กับเราไปนานๆ',
 svg:()=>sky('#14183a','#4a3a6a')+stars(40)+moon(130,16,7)+[10,25,40,55,70,85,100,115,130,145,18,48,78,108,138].map((x,i)=>lantern(x,95+(i%4)*5,i*1.3)).join('')+river(66,'#1d3a46')+person(20,72,'#e0b04a',1.2)+person(32,73,'#e07a8a',1)+person(124,72,'#7ac0a8',1.2)+[0,1,2,3,4].map(i=>krat(50+i*18,72+(i%2)*8,1)).join('')},
{d:10,t:'แสงเทียนดวงเล็กๆ บนสายน้ำ คือคำขอบคุณ คำอธิษฐาน และความหวัง ที่ส่งต่อจากรุ่นสู่รุ่น สุขสันต์วันลอยกระทง',
 svg:()=>sky('#0f1430','#2b3a5a')+stars(45)+moon(80,26,13)+river(58,'#16303c')+krat(80,72,2.2)+`<text x="80" y="14" text-anchor="middle" font-family="Charmonman,serif" font-size="8" fill="#f8e7a8">สุขสันต์วันลอยกระทง</text>`}
];
const names=['','ฉากที่ 1','ฉากที่ 2','ฉากที่ 3','ฉากที่ 4','ฉากที่ 5','ฉากที่ 6','ฉากที่ 7'];
const starts=[];let acc=0;scenes.forEach(s=>{starts.push(acc);acc+=s.d});
scenes.forEach((s,i)=>{const e=document.createElementNS('http://www.w3.org/2000/svg','svg');e.setAttribute('viewBox','0 0 160 90');e.setAttribute('preserveAspectRatio','xMidYMid slice');e.setAttribute('aria-hidden','true');e.innerHTML=s.svg()+frame;S.insertBefore(e,document.getElementById('ttl'));s.el=e});
const sub=document.getElementById('sub'),ttl=document.getElementById('ttl'),bar=document.getElementById('bar'),tm=document.getElementById('tm'),pb=document.getElementById('play'),vo=document.getElementById('vo');
let t=0,playing=false,last=0,cur=-1,voice=true;
const fmt=x=>Math.floor(x/60)+':'+String(Math.floor(x%60)).padStart(2,'0');
function say(i){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();if(!voice||!playing)return;const u=new SpeechSynthesisUtterance(scenes[i].t);u.lang='th-TH';const th=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith('th'));if(th)u.voice=th;u.rate=Math.min(1.4,Math.max(.8,scenes[i].t.length/(scenes[i].d*7.5)));speechSynthesis.speak(u)}
function show(i){if(i===cur)return;cur=i;scenes.forEach((s,k)=>s.el.classList.toggle('on',k===i));sub.textContent=scenes[i].t;ttl.textContent=names[i+1]+' / 7';say(i)}
function upd(){let i=0;for(let k=0;k<starts.length;k++)if(t>=starts[k])i=k;show(i);bar.value=t;tm.textContent=fmt(t)+' / 3:00'}
function tick(n){if(!playing)return;t+=(n-last)/1000;last=n;if(t>=180){t=180;playing=false;pb.textContent='↻ เล่นอีกครั้ง';upd();return}upd();requestAnimationFrame(tick)}
pb.onclick=()=>{if(t>=180){t=0;cur=-1}playing=!playing;pb.textContent=playing?'⏸ หยุด':'▶ เล่น';if(playing){last=performance.now();cur=-1;requestAnimationFrame(tick)}else if('speechSynthesis' in window)speechSynthesis.pause();upd()};
bar.oninput=()=>{t=+bar.value;cur=-1;upd()};
vo.onclick=()=>{voice=!voice;vo.setAttribute('aria-pressed',voice);vo.textContent=voice?'🔊 เสียงบรรยาย':'🔇 ปิดเสียง';if(!voice&&'speechSynthesis' in window)speechSynthesis.cancel();else{cur=-1;upd()}};
if('speechSynthesis' in window)speechSynthesis.getVoices();
upd();
</script>
</body>
</html>
